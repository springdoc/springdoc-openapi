# Builds and tests every pull request.
name: CI

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# Supersede in-flight runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B --no-transfer-progress -Dmaven.artifact.threads=16
  MAVEN_OPTS: -Xmx3g

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # -Pci is a no-op on this branch (the profile is empty here, there is no
      # frontend module) but is kept so the command matches main.
      - name: Test
        run: mvn $MAVEN_ARGS -Pci -T1C test
