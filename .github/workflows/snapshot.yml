# Tests and publishes a SNAPSHOT to Maven Central on every push to a release line.
name: Snapshot

on:
  push:
    branches: [main, spring-boot-3]
    paths-ignore: ['**.md', 'docs/**']

# Never cancel a deploy that is already publishing.
concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

# ./mvnw pins Maven 3.9.x (.mvn/wrapper): Maven 3.10 restricts where server credentials
# are sent (repositoryOrigins), which made the Central uploads fail with 401.
env:
  MAVEN_ARGS: -B -V --no-transfer-progress -Dmaven.artifact.threads=16
  MAVEN_OPTS: -Xmx3g

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # -Pci is a no-op on this branch (the profile is empty here, there is no
      # frontend module) but is kept so the command matches main.
      - name: Test and deploy snapshot
        run: ./mvnw $MAVEN_ARGS -Pci,gpg -T1C -Dmaven.javadoc.skip=true deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
