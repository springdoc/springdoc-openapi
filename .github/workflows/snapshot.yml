# Tests and publishes a SNAPSHOT to Maven Central on every push to a release line.
name: Snapshot

on:
  push:
    branches: [main, spring-boot-3]
    paths-ignore: ['**.md', 'docs/**']

# Never cancel a deploy that is already publishing.
concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

env:
  MAVEN_ARGS: -B --no-transfer-progress -Dmaven.artifact.threads=16
  MAVEN_OPTS: -Xmx3g

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/src/main/frontend/package-lock.json') }}
          restore-keys: npm-

      # Both profiles are explicit: -Pgpg alone would deactivate the activeByDefault
      # ci profile and silently skip the npm frontend build.
      - name: Test and deploy snapshot
        run: mvn $MAVEN_ARGS -Pci,gpg -T1C -Dmaven.javadoc.skip=true deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
